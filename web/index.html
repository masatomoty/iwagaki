<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<link rel="icon" href="data:," />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>iwagaki — 舞鶴・吉原 高潮浸水ビューア</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#0b111c;
    --panel:#121d2d;
    --control:#1b2b40;
    --control-hover:#253a55;
    --line:#3b4d64;
    --fg:#eaf0f7;
    --muted:#a5b1c0;
    --accent:#1478ff;
    --focus:#6bb0ff;
    --font-ui: "Noto Sans JP", "Roboto", Arial, sans-serif;
    --font-mono: "SFMono-Regular", Menlo, Consolas, monospace;
          /* #controls-top と section 展開時 #toolbar の共通・固定高さ。
             西舞鶴で「道路の色＝交通規制」を選んだとき（凡例が一番長い）に合わせてある */
          --toppanel-h: 248px; }
  * { box-sizing: border-box; }
  html, body, #map { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.55 var(--font-ui); }
  #map { position: absolute; inset: 0; }
  .panel { position: absolute; background: color-mix(in srgb, var(--panel) 94%, transparent); border: 1px solid var(--line);
           border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(10px); box-shadow: 0 8px 24px rgba(0,0,0,.28); }
  /* 画面上部に横幅いっぱいで**固定**する帯（浮かせない）。見出しと「何の上の
     何を見ているか」の 2 択（対象範囲・地形データ）＋出典だけ。サイドバーの外
     なので、どのタブを開いていても、サイドバーをスクロールしても常に見える。
     高さは 46px で、地図・サイドバー・ビューキューブはすべてこの下から始まる
     （2026-09。以前は見出しと 2 択もサイドバーの頭に積んでいた） */
  #topbar { position: absolute; top: 0; left: 0; right: 0; height: 46px; z-index: 10;
            display: flex; align-items: center; gap: 16px; padding: 0 14px;
            background: color-mix(in srgb, var(--panel) 97%, transparent);
            border-bottom: 1px solid var(--line);
            backdrop-filter: blur(10px); box-shadow: 0 4px 16px rgba(0,0,0,.22); }
  #topbar h1 { margin: 0; flex: 0 0 auto; white-space: nowrap; }
  #topbar .tbsel { display: flex; align-items: center; gap: 7px; min-width: 0;
    font-size: 11px; color: var(--muted); letter-spacing: .04em; white-space: nowrap; }
  #topbar .tbsel select { width: auto; flex: 0 1 auto; min-width: 90px;
    padding: 5px 26px 5px 9px; font-size: 12.5px; }
  /* いま解いている潮位（`#tb-wl-v` を controls.ts が書き換える）。地形データの
     右、キー操作案内の左。主変数なので値だけ 1 段大きく明るく出す */
  #topbar .tb-wl { flex: 0 0 auto; font-size: 11px; color: var(--muted);
    letter-spacing: .04em; white-space: nowrap; cursor: help; }
  #topbar .tb-wl b { margin: 0 2px; font-size: 13.5px; color: var(--fg);
    letter-spacing: 0; font-variant-numeric: tabular-nums; }
  #topbar .tb-wl-u { font-size: 10px; }
  /* 操作設定を開くボタン（`ui/operationSettingsModal.ts`）。潮位の右、キー案内の左 */
  #topbar .tb-btn { flex: 0 0 auto; font-size: 11px; color: var(--muted);
    letter-spacing: .04em; white-space: nowrap; background: var(--control);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  #topbar .tb-btn:hover { border-color: var(--accent); color: var(--fg); }
  /* 右端はキー操作案内 ＋ 縦線 ＋ 出典。キー案内が余白を吸って右へ寄せる */
  #topbar .tb-keys { margin-left: auto; flex: 0 0 auto; font-size: 11px;
    color: var(--muted); letter-spacing: .03em; white-space: nowrap; }
  #topbar .tb-keys kbd { margin: 0 1px; }
  /* #topbar は折り返さない 1 行の flex なので、幅が足りないと右側（操作設定・出典）が
     画面の外へ押し出されて届かなくなる。ヒントに過ぎないキー操作案内を先に落として
     幅を空ける（実測: フル項目で約 980px が必要、キー案内を落とせば約 720px で収まる） */
  @media (max-width: 1000px) {
    #topbar .tb-keys { display: none; }
  }
  /* 出典は畳んで置く。ホバー／フォーカスで全文（下に垂らす） */
  #topbar .tb-src { flex: 0 0 auto; position: relative; cursor: help;
    padding-left: 15px; border-left: 1px solid var(--line);
    font-size: 11px; color: var(--muted); letter-spacing: .04em; white-space: nowrap; }
  #topbar .tb-src-lbl { text-decoration: underline dotted; text-underline-offset: 3px; }
  #topbar .tb-src:hover, #topbar .tb-src:focus-visible { color: var(--fg); outline: none; }
  #topbar .tb-src-pop { position: absolute; top: calc(100% + 9px); right: 0;
    width: 520px; max-width: 78vw; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 13px;
    font-size: 11.5px; line-height: 1.6; color: var(--muted); letter-spacing: 0;
    white-space: normal; box-shadow: 0 10px 30px rgba(0,0,0,.45); z-index: 6;
    visibility: hidden; opacity: 0; transition: opacity .12s; }
  #topbar .tb-src:hover .tb-src-pop, #topbar .tb-src:focus-within .tb-src-pop {
    visibility: visible; opacity: 1; }

  /* ボタン／トグル／select の説明（U2）。`[data-tip]` を持つ要素にホバー／
     フォーカスすると `ui/tooltip.ts` が単一ノードを body 直下へ position:fixed で
     出す（サイドバー #controls-tabs が overflow スクロールでクリップするため）。
     z-index は #topbar(10) より上。**地図（暗い背景）や操作パネルの上に重なるので、
     パネル地色（ほぼ黒）だと文字が沈む。1 段持ち上げた地に明るい文字で出す。** */
  #ui-tooltip {
    position: fixed; left: 0; top: 0; z-index: 20; max-width: 320px;
    background: #263342; border: 1px solid #425368; border-radius: 8px;
    padding: 10px 13px; font-size: 13px; line-height: 1.65; color: #f2f4f8;
    letter-spacing: 0; white-space: pre-line; pointer-events: none;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
    opacity: 0; transition: opacity .12s; }
  #ui-tooltip.is-shown { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { #ui-tooltip { transition: none; } }

  /* 操作パネル（サイドバー）は**2 枚のパネルに分ける**。上＝地形の色＋凡例
     （＝今どの面を見ているか）、下＝タブ（＝何を重ね・どう調べるか）。
     #controls 自体は枠なしのレイアウト箱で、中の2枚が .panel */
  #controls { position: absolute; top: 58px; left: 12px; width: 318px; bottom: 12px;
              display: flex; flex-direction: column; gap: 10px; }
  /* 中の 2 枚は .panel の見た目だけ借りて、位置は flex に任せる */
  #controls-top, #controls-tabs { position: static; }
  /* 高さは固定（凡例の行数が変わっても上下しない）。はみ出す極端な組み合わせだけ
     凡例内でスクロールする */
  #controls-top { flex: 0 0 auto; height: var(--toppanel-h);
                  display: flex; flex-direction: column; }
  #controls-top > #tpaint { flex: 0 0 auto; margin-bottom: 9px; }
  #controls-tabs { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
                   overflow: hidden; }
  #controls-tabs > .tabs { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  /* 断面ツール。「測線を引く」とグラフを 1 枚のパネルにまとめ、サイドバー（左）と
     ビューキューブ（右）の間に置く。線を引くと下にグラフが開き、パネルの高さは
     左の #controls-top（地形の色＋凡例）と揃う（2026-09 指示） */
  #toolbar { position: absolute; top: 58px; left: 342px; right: 180px;
             display: flex; flex-direction: column; padding: 8px 12px; gap: 8px; }
  body.section-open #toolbar { height: var(--toppanel-h); }
  #toolbar-row { display: flex; align-items: center; gap: 12px; flex: 0 0 auto; }
  #toolbar-row b { flex: 0 0 auto; font-size: 12px; font-weight: 600; color: var(--muted);
    letter-spacing: .04em; }
  #toolbar #secbtn { flex: 0 0 auto; background: var(--control); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 14px;
    font-size: 12.5px; cursor: pointer; }
  #toolbar #secbtn:hover { border-color: var(--accent); }
  #toolbar #secbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent);
    color: #fff; font-weight: 600; }

  /* ビューキューブ。トップバー（高さ 46px）の下・右端に置く。
     キューブの上隅がバー下辺に食い込まないよう十分下げる */
  #viewcube { position: absolute; top: 66px; right: 8px; z-index: 5; }
  #viewcube-home {
    position: absolute; top: 0; left: 0; width: 30px; height: 30px;
    background: transparent; border: none; padding: 0; cursor: pointer;
    color: rgba(226,232,240,.6); font-size: 22px; line-height: 1;
    text-shadow: 0 1px 2px rgba(0,0,0,.65); transition: color .12s;
  }
  #viewcube-home:hover { color: rgba(255,255,255,.98); }
  /* 断面グラフ。#toolbar の中で「測線を引く」行の下に開く。測線が短いと
     0〜3 m の起伏が読めないので、canvas は残りの高さいっぱいに広げる */
  #section { display: none; flex: 1 1 auto; min-height: 0; flex-direction: column; }
  #section .sec-head { display: flex; justify-content: flex-end; align-items: center;
    gap: 6px; margin-bottom: 4px; flex: 0 0 auto; }
  /* 「全体を見る」「×」は #toolbar の「測線を引く」（#secbtn）と同じ高さ・見た目に揃える */
  #sec-fit, #sec-close { background: var(--control); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px; line-height: 1.55;
    padding: 6px 14px; cursor: pointer; }
  #sec-fit, #sec-close { font-size: 12.5px; }
  #sec-fit { margin-right: 6px; }
  #sec-close { padding: 6px 12px; }
  #sec-fit:hover, #sec-close:hover { border-color: var(--accent); color: var(--fg); }
  #sec-canvas { width: 100%; flex: 1 1 auto; min-height: 0; display: block; }
  #section .note { margin-top: 2px; flex: 0 0 auto; }
  /* 属性情報（#panel-attr）。地物クリックの中身。以前は右上に浮くパネルだった */
  /* 非選択時の案内。テキストだけだと気づかれないので i アイコン＋枠線で囲う */
  .emptyhint { display: flex; gap: 9px; align-items: flex-start;
    border: 1px solid var(--line); border-radius: 8px;
    background: color-mix(in srgb, var(--panel) 55%, transparent);
    padding: 11px 12px; }
  .emptyhint-i { flex: 0 0 auto; width: 16px; height: 16px; margin-top: 1px; color: var(--accent); }
  .emptyhint p { margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--muted); }
  #panel-attr .insp-head { display: flex; align-items: baseline; justify-content: space-between; }
  #insp-close { background: transparent; border: none; color: rgba(226,232,240,.55);
    font-size: 19px; line-height: 1; cursor: pointer; padding: 0 2px; }
  #insp-close:hover { color: #fff; }
  /* 出典は下辺の常時バーをやめ、トップバー右端の「出典」に畳んだ（`#topbar .tb-src`）。
     PLATEAU / 京都府 DEM / 気象庁はいずれも表示を求めているが、ラベルは常に見え、
     ホバー／フォーカスで全文に到達できる（MapLibre の畳んだ AttributionControl と同じ） */
  /* 計測パネルは開発者向け。既定は隠す（?perf=1 / P キーで開く）。
     表示時は地図画面の右下に置く */
  #perf { display: none; right: 12px; bottom: 12px; width: 300px; max-height: 46%; overflow: auto;
           font-variant-numeric: tabular-nums; }
  /* 地点＋徒歩圏（T1）。既定は隠す（`catalog.point_buffer` が無い配信物では出さない）。
     左メニューの右下に置く */
  #point-buffer { display: none; left: 342px; bottom: 12px; width: 300px; max-height: 46%;
                  overflow: auto; }
  h1 { font-size: 14.5px; margin: 0 0 2px; letter-spacing: .02em; }
  .sub { color: var(--muted); font-size: 12px; margin: 0 0 10px; }
  fieldset { border: 0; padding: 0; margin: 0 0 12px; }
  legend { font-size: 12.5px; color: var(--muted); padding: 0; margin-bottom: 5px; letter-spacing: .04em; text-transform: uppercase; }
  .seg { display: flex; gap: 4px; }
  .seg button { flex: 1; background: var(--control); color: var(--fg); border: 1px solid var(--line); border-radius: 6px;
                padding: 7px 5px; font-size: 12.5px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  label.row { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 13.5px; }
  /* display を持つ規則は [hidden] の display:none に勝ってしまうので明示する */
  label.row[hidden] { display: none; }
  /* 重ねる（レイヤー）は縦一列だと6〜8項目でかなりの高さになる。2列にして詰める。
     長いラベルは折り返してよい（"窪地（逆流で浸水しうる）" 等） */
  .layergrid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 8px; }
  .layergrid label.row { padding: 2px 0; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  /* ドラッグだけだと 0.05 m 刻みを合わせにくい。−/＋ で 1 段ずつ動かせるようにする */
  .wlrow { display: flex; align-items: center; gap: 6px; }
  .wlrow input[type=range] { flex: 1 1 auto; min-width: 0; }
  .stepbtn {
    flex: 0 0 auto; width: 30px; height: 30px; background: var(--control); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px; font-size: 16px; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .stepbtn:hover { border-color: var(--accent); }
  .stepbtn:active { background: var(--accent); color: #fff; }
  .tickbar { position: relative; height: 6px; margin: -4px 0 2px; }
  .tickbar i { position: absolute; top: 0; width: 1px; height: 6px; background: var(--muted); }
  .seg.wrap { flex-wrap: wrap; gap: 3px; }
  .seg.wrap button { flex: 1 1 46%; line-height: 1.25; padding: 4px 2px; }
  .seg.wrap button .sub { font-size: 10px; }
  .seg.models { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .seg.models button { min-width: 0; line-height: 1.25; padding: 5px 2px; font-size: 11.5px; }
  .wl { display: flex; justify-content: space-between; align-items: baseline; }
  .wl b { font-size: 22px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
  .ticks { display: flex; justify-content: space-between; color: var(--muted); font-size: 11.5px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 2px 0; vertical-align: top; }
  td:first-child { color: var(--muted); white-space: nowrap; padding-right: 8px; }
  .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; letter-spacing: -.02em; }
  .tag { display: inline-block; padding: 2px 7px; border-radius: 999px; font-size: 11.5px; border: 1px solid var(--line); }
  .tag.chg { background: #4a2529; border-color: #87434a; color: #ffb8bb; }
  .tag.same { background: #22372b; border-color: #3c604b; color: #a8d8b8; }
  .tag.warn { background: #44371e; border-color: #725d2d; color: #f1d58b; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  /* 凡例は 2 列。左（#legend-main）＝画面の色（地形＋レイヤ）、
     右（#legend-bldg）＝建物の色の内訳（棟数）。建物の色が none 以外のときだけ
     右列が出て、**中央固定の縦線**で下端まで仕切る（両列とも 50%）。
     高さは #controls-top（固定）の残りを埋める。凡例が極端に長いときだけ内部スクロール */
  #legend { flex: 1 1 auto; min-height: 0; overflow-y: auto;
    display: flex; align-items: stretch; padding: 10px 0;
    font-size: 11.5px; line-height: 1.5; }
  #legend .sub { font-size: 11px; }
  #legend-main { flex: 1 1 auto; min-width: 0; }
  #legend-bldg:empty { display: none; }
  #legend-bldg { flex: 1 1 50%; min-width: 0; padding-left: 13px; }
  #legend:has(#legend-bldg:not(:empty)) #legend-main {
    flex-basis: 50%; padding-right: 13px; border-right: 1px solid var(--line);
  }
  .note { color: var(--muted); font-size: 12px; margin-top: 8px; line-height: 1.5; }
  #perf table td { padding: 1px 0; }
  .bad { color: #ff9a9a; } .ok { color: #9fd6ac; }

  /* ---- 操作パネルの中身 -------------------------------------------------
     グループの見出しは 2 段だけ。fieldset/legend をやめたのは、8 個が
     フラットに並ぶ形そのものが問題だったため */
  /* **uppercase にしない。** 条件名（0.5m）を含むので 0.5M に化ける */
  .grouplabel { font-size: 11.5px; color: var(--muted); letter-spacing: .04em; margin: 0 0 5px; }
  .subhead { font-size: 11.5px; color: var(--muted); letter-spacing: .04em;
    margin: 12px 0 5px; }
  .subhead:first-child { margin-top: 0; }
  /* 見出し行にダウンロードボタンを添える（地域別の浸水建物・巡回対象リスト）。
     見出しの右側に小さく置く。押しても画面は変わらないので目立たせすぎない */
  .subhead-row { display: flex; align-items: baseline; justify-content: space-between;
    gap: 8px; margin: 12px 0 5px; }
  .subhead-row .subhead { margin: 0; }
  .dlbtn { background: transparent; color: var(--muted); border: 1px solid var(--line);
    border-radius: 5px; padding: 2px 7px; font-size: 10.5px; line-height: 1.4;
    cursor: pointer; white-space: nowrap; }
  .dlbtn:hover:not(:disabled) { color: var(--fg); border-color: var(--accent); }
  .dlbtn:disabled { opacity: .4; cursor: default; }
  .dlgroup { display: flex; gap: 5px; flex-wrap: wrap; }
  .dllist { display: flex; flex-direction: column; gap: 3px; margin: 4px 0 2px; }
  .dllist .dlrow { display: flex; align-items: center; justify-content: space-between;
    gap: 8px; font-size: 11.5px; color: var(--muted); }
  .seg button:disabled { opacity: .38; cursor: default; }
  .seg button:hover:not(:disabled):not([aria-pressed="true"]) { border-color: var(--accent); }

  /* 地域別の浸水建物（要望③）。表を主にする。潮位再生パネルのすぐ下に置く。
     幅が狭いので数値列は詰め、小地域名だけ折り返しを許す */
  .areatab { table-layout: fixed; font-variant-numeric: tabular-nums; margin-bottom: 4px; }
  .areatab thead td { color: var(--muted); font-size: 11px; border-bottom: 1px solid var(--line);
    padding-bottom: 2px; }
  .areatab td { padding: 2px 0; font-size: 12px; }
  .areatab td.num { width: 14%; padding-left: 3px; }
  .areatab td.an { color: var(--fg); white-space: normal; overflow-wrap: anywhere; line-height: 1.3; }
  .areatab tr.ar td { color: var(--muted); }
  .areatab tr.at td { border-top: 1px solid var(--line); color: var(--fg); font-weight: 600; }


  /* select は全部同じ見た目にする。**要素セレクタでかける。** 同じ条件を選ぶ
     道路の色・徒歩圏の起点・建物の色・対象範囲・地形データがブラウザ既定の
     素の見た目のまま混在しないように（2026-09） */
  select {
    width: 100%; flex: 1 1 auto; min-width: 0; appearance: none;
    background: var(--control) no-repeat right 7px center;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                      linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-size: 5px 5px, 5px 5px;
    background-position: right 12px center, right 7px center;
    color: var(--fg); border: 1px solid var(--line); border-radius: 6px;
    padding: 7px 26px 7px 9px; font: 13.5px/1.3 inherit; cursor: pointer;
  }
  select:hover { border-color: var(--accent); }
  .compare-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
  .compare-row button { min-width: 0; background: var(--control); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 4px; font-size: 11.5px; line-height: 1.25; cursor: pointer; }
  .compare-row button:hover:not(:disabled):not([aria-pressed="true"]) { border-color: var(--accent); }
  .compare-row button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent);
    color: #fff; font-weight: 600; }
  .compare-row button:disabled { opacity: .38; cursor: default; }

  /* 参照潮位＝押すとその潮位に飛ぶ一覧（旧チップと統合）。スライダ直下に置く */
  .reflist { display: grid; gap: 3px; margin-top: 4px; }
  .reflist button { display: flex; justify-content: space-between; background: transparent;
    color: var(--muted); border: 1px solid var(--line); border-radius: 5px;
    padding: 5px 8px; font-size: 12px; cursor: pointer; text-align: left; }
  .reflist button:hover { color: var(--fg); border-color: var(--accent); }
  .reflist button b { font-variant-numeric: tabular-nums; color: var(--fg); }

  /* 潮位の再生（U3）。曲線そのものを主にする＝スクラブ用のスライダは曲線の
     真下に同じ幅で置き、再生ヘッド（縦線）を曲線上に重ねる。以前は曲線に
     stroke が無く画面に出ておらず、"再生" ボタンだけがスライダに潰されて
     縦書きになっていた（2026-09） */
  #playback { display: flex; flex-direction: column; gap: 9px; }
  #playback #pcurve { font-size: 12.5px; }
  /* 舞鶴の潮位予測（気象庁, Worker 経由）の更新ボタンと状態行。
     select（曲線選択）のすぐ下に来るので、上にも少し余白を取って離す */
  .pb-forecast { display: flex; flex-direction: column; gap: 8px; margin-top: 2px; }
  #tide-refresh { align-self: flex-start; background: var(--control); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px;
    font-size: 12px; line-height: 1.2; cursor: pointer; }
  #tide-refresh:hover:not(:disabled) { border-color: var(--accent); }
  #tide-refresh:disabled { opacity: .55; cursor: default; }
  .pb-forecast-status { display: flex; flex-wrap: wrap; gap: 3px 10px;
    font-size: 11px; color: var(--muted); line-height: 1.5; }
  .pb-forecast-status b { color: var(--fg); font-variant-numeric: tabular-nums; }
  .pb-forecast-msg.err { color: #f28b82; flex-basis: 100%; }
  .pb-forecast-msg.warn { color: #ffcf7a; flex-basis: 100%; }
  .pb-graph { display: flex; flex-direction: column; gap: 3px; }
  svg.tidecurve { display: block; width: 100%; height: 54px; overflow: visible; }
  #curve { fill: none; stroke: var(--accent); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  #curve-fill { fill: color-mix(in srgb, var(--accent) 15%, transparent); stroke: none; }
  #playhead { stroke: var(--fg); stroke-width: 1; vector-effect: non-scaling-stroke; opacity: .85; }
  #peakdot { fill: #ffcf7a; stroke: var(--panel); stroke-width: 1; }
  #playback #ptime { width: 100%; margin: 0; }
  .pb-bar { display: flex; align-items: center; gap: 8px; }
  #play { flex: 0 0 auto; min-width: 76px; background: var(--control); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px;
    font-size: 12.5px; line-height: 1.2; cursor: pointer; white-space: nowrap; }
  #play:hover { border-color: #3d4657; }
  #play[aria-pressed="true"] { background: var(--accent); border-color: var(--accent);
    color: #fff; font-weight: 600; }
  .pb-bar .seg { flex: 1 1 auto; }
  .pb-bar .seg button { font-size: 11px; padding: 6px 3px; }
  .pb-read { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; }
  .pb-read > div { display: contents; }
  .pb-read dt { color: var(--muted); font-size: 11px; letter-spacing: .04em; }
  .pb-read dd { margin: 0; font-size: 12.5px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .pb-stats { font-size: 11.5px; color: var(--muted); line-height: 1.6;
    font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .pb-stats b { color: var(--fg); }
  .pb-stats .pb-fig { white-space: nowrap; }

  /* 下位オプションは入れ子にする（徒歩圏の起点など） */
  .nested { margin: 3px 0 2px 19px; padding-left: 9px;
    border-left: 1px solid rgba(148,163,184,.2); }
  /* 雨量シナリオのカスタム入力（雨量 mm／継続 h）。潮位スライダと同じタブに置く */
  .rainrow { display: flex; gap: 10px; margin: 6px 0 0; flex-wrap: wrap; }
  /* display を持つ規則は [hidden] の display:none に勝つので明示する（label.row と同じ） */
  .rainrow[hidden] { display: none; }
  .rainrow label { display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--muted); }
  .rainrow input[type=number] { width: 68px; background: var(--control); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 7px; font: 13px/1.2 inherit; }
  .rainrow input[type=number]:hover { border-color: var(--accent); }
  .rain-err { color: #ffb4a8; font-size: 11.5px; margin-top: 5px; line-height: 1.4; }
  .rain-err[hidden] { display: none; }

  /* 道路の色・建物の色は入れ子にしない＝表示対象と同じ左端。上下に余白 */
  .colsel { margin: 12px 0; }
  label.row.off { color: #5f6875; }
  label.row.off input { opacity: .45; }

  /* 畳む機能は持たない。**常に見えている。** 節が 4 つしか無く、
     畳むと「押さないと分からない」ものが増えるだけだった */
  .group { padding-left: 2px; }
  kbd { font: 500 11px/1.4 var(--font-mono);
    background: var(--control); border: 1px solid var(--line); border-radius: 3px;
    padding: 1px 4px; color: var(--muted); }
  .keyrow { display: flex; justify-content: space-between; gap: 8px;
    font-size: 12px; color: var(--muted); padding: 3px 0; }
  .srcnote { color: var(--muted); font-size: 12px; line-height: 1.55; margin: 7px 0 0; }
  .srcnote b { color: var(--fg); font-weight: 600; }
  .btnwide { width: 100%; background: var(--control); color: var(--fg); cursor: pointer;
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 5px; font-size: 12.5px; }
  .btnwide:hover { border-color: var(--accent); }
  .btnwide[aria-pressed="true"] { background: var(--accent); border-color: var(--accent);
    color: #fff; font-weight: 600; }
  button:hover:not(:disabled), select:hover { background-color: var(--control-hover); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* タブ（本体側を3節に分ける）。選択中＝太字＋アクセント色の下線バー、
     未選択は hover で下線が出る。role=tablist・矢印キー移動に対応。
     タブの並び（.tablist）は伸縮しない固定行。中身が長いタブだけ
     .tabpanels の中でスクロールし、タブ自体は常に見えたまま動かない */
  .tabs .tablist { flex: 0 0 auto; display: flex; border-bottom: 1px solid var(--line); }
  .tabs .tab {
    appearance: none; flex: 1 1 auto; background: transparent; border: none;
    color: var(--muted); font: inherit; font-size: 12.5px; letter-spacing: .01em;
    padding: 7px 4px 8px; cursor: pointer; position: relative; text-align: center;
  }
  .tabs .tab:hover { color: var(--fg); }
  .tabs .tab[aria-selected="true"] { color: var(--fg); font-weight: 600; }
  .tabs .tab[aria-selected="true"]::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
    background: var(--accent);
  }
  .tabs .tabpanels { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  .tabs .tabpanel { padding-top: 12px; }
  .tabs .tabpanel[hidden] { display: none; }
  /* タブ内のセクション境界。余白＋ヘアラインで「どこからどこまで」を出す。
     .nested の中の見出しには効かせない（直下の子だけ） */
  .tabpanel > .grouplabel:not(:first-child),
  .tabpanel > .subhead:not(:first-child),
  .tabpanel > #playbackslot:not(:empty),
  .tabpanel > #areagroup:not([hidden]) {
    margin-top: 17px; padding-top: 14px; border-top: 1px solid var(--line);
  }
  .tabpanel > #playbackslot > .grouplabel { margin-top: 0; padding-top: 0; border-top: 0; }

  /* 初見者向けの起動時モーダル（`docs/todo.md` U6、`src/ui/startupModal.ts`）。
     地図の上に暗幕＋中央のカード。**初見者向けなので文字は大きめ・横長**
     （主役の「浸水の決め方」を左に広く、対象地域・潮位を右に畳む） */
  #startup-modal { position: fixed; inset: 0; z-index: 30;
    display: flex; align-items: center; justify-content: center; padding: 24px;
    background: rgba(6, 8, 12, .58); backdrop-filter: blur(3px);
    animation: intro-fade .14s ease-out; }
  @keyframes intro-fade { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #startup-modal { animation: none; } }
  #startup-modal .intro-card { width: 880px; max-width: 100%;
    max-height: calc(100vh - 48px); overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 22px 28px; box-shadow: 0 24px 60px rgba(0, 0, 0, .5); }
  #startup-modal h2 { margin: 0 0 7px; font-size: 20px; }
  #startup-modal .intro-lead { margin: 0 0 16px; font-size: 14px; line-height: 1.7;
    color: var(--fg); }
  #startup-modal .intro-cols { display: grid; grid-template-columns: 1.4fr 1fr;
    gap: 2px 44px; align-items: start; }
  @media (max-width: 760px) {
    #startup-modal .intro-cols { grid-template-columns: 1fr; row-gap: 14px; }
  }
  /* fieldset の padding-top は legend を字下げせず「legend 以降の中身」だけを
     押し下げる（`#opsettings-modal` と同じ）。見出しの直下が広くなりすぎるので
     padding は持たせず、グループ間は fieldset 間マージンで作る */
  #startup-modal fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  #startup-modal .intro-side fieldset + fieldset { margin-top: 14px; }
  #startup-modal legend { padding: 0; font-size: 12.5px; font-weight: 700;
    letter-spacing: .05em; color: var(--muted); margin-bottom: 6px; }
  #startup-modal .opt { display: grid; grid-template-columns: auto 1fr;
    column-gap: 10px; align-items: baseline; padding: 6px 0; cursor: pointer; }
  #startup-modal .opt input { margin: 0; width: 16px; height: 16px; accent-color: var(--accent); }
  #startup-modal .opt-t { grid-column: 2; font-size: 15.5px; }
  #startup-modal .opt-t em { font-style: normal; margin-left: 8px; padding: 2px 8px;
    border-radius: 999px; font-size: 11.5px; font-weight: 700; vertical-align: 1px;
    background: color-mix(in srgb, var(--accent) 28%, transparent); color: var(--fg); }
  #startup-modal .opt-d { grid-column: 2; margin-top: 1px; font-size: 13px;
    line-height: 1.55; color: var(--muted); }
  #startup-modal .intro-tides { display: grid; grid-template-columns: 1fr; }
  #startup-modal .opt-inline { padding: 6px 0; grid-template-columns: auto 1fr auto; align-items: baseline; }
  #startup-modal .opt-inline .opt-t { grid-column: 2; font-size: 14.5px; }
  #startup-modal .opt-v { grid-column: 3; font-size: 13px; color: var(--muted);
    font-variant-numeric: tabular-nums; }
  #startup-modal .intro-foot { display: flex; align-items: center; justify-content: space-between;
    gap: 14px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line);
    flex-wrap: wrap; }
  #startup-modal .intro-hide { display: flex; align-items: center; gap: 8px;
    font-size: 14px; color: var(--fg); cursor: pointer; }
  #startup-modal .intro-hide input { margin: 0; width: 15px; height: 15px; }
  #startup-modal .intro-btns { display: flex; gap: 10px; margin-left: auto; }
  #startup-modal .intro-btns button { border-radius: 8px; padding: 11px 22px;
    font-size: 15px; cursor: pointer; border: 1px solid var(--line); }
  #startup-modal .intro-secondary { background: var(--control); color: var(--fg); }
  #startup-modal .intro-secondary:hover { border-color: var(--accent); }
  #startup-modal .intro-primary { background: var(--accent); border-color: var(--accent);
    color: #fff; font-weight: 700; }
  #startup-modal .intro-primary:hover { filter: brightness(1.06); }
  #startup-modal :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 操作設定モーダル（`ui/operationSettingsModal.ts`）。ドラッグの回転方向・役割・
     感度を変える小さなカード。`#startup-modal` と見た目の作りは同じだが、対象地域を
     替えるような読み込み直しは無い＝1 カラムで小さく、選ぶと即時反映する */
  #opsettings-modal { position: fixed; inset: 0; z-index: 30;
    display: flex; align-items: center; justify-content: center; padding: 24px;
    background: rgba(6, 8, 12, .58); backdrop-filter: blur(3px);
    animation: intro-fade .14s ease-out; }
  @media (prefers-reduced-motion: reduce) { #opsettings-modal { animation: none; } }
  #opsettings-modal .intro-card { width: 460px; max-width: 100%;
    max-height: calc(100vh - 48px); overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 22px 26px; box-shadow: 0 24px 60px rgba(0, 0, 0, .5); }
  #opsettings-modal h2 { margin: 0 0 7px; font-size: 18px; }
  #opsettings-modal .intro-lead { margin: 0 0 15px; font-size: 13px; line-height: 1.6;
    color: var(--muted); }
  /* fieldset の padding-top は legend を字下げしない（legend はブラウザ特有の
     別扱いで、padding は legend の後の中身だけを押し下げる）ため、見出しの下だけ
     広く上が詰まって余白が逆転していた。見出しの前後は fieldset 間マージンと
     legend の margin-bottom で作る */
  #opsettings-modal fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  #opsettings-modal fieldset + fieldset { margin-top: 14px; }
  #opsettings-modal legend { padding: 0; font-size: 12px; font-weight: 700;
    letter-spacing: .05em; color: var(--muted); margin-bottom: 6px; }
  #opsettings-modal .opt { display: grid; grid-template-columns: auto 1fr;
    column-gap: 10px; align-items: baseline; padding: 6px 0; cursor: pointer; }
  #opsettings-modal .opt input { margin: 0; width: 16px; height: 16px; accent-color: var(--accent); }
  #opsettings-modal .opt-t { grid-column: 2; font-size: 14.5px; }
  #opsettings-modal .opt-t em { font-style: normal; margin-left: 8px; padding: 2px 8px;
    border-radius: 999px; font-size: 11px; font-weight: 700; vertical-align: 1px;
    background: color-mix(in srgb, var(--accent) 28%, transparent); color: var(--fg); }
  #opsettings-modal .opt-d { grid-column: 2; margin-top: 1px; font-size: 12.5px;
    line-height: 1.5; color: var(--muted); }
  #opsettings-modal .opset-sens { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  #opsettings-modal .opset-sens input[type="range"] { flex: 1 1 auto; accent-color: var(--accent); }
  #opsettings-modal .opset-sens span { flex: 0 0 auto; font-size: 13px; color: var(--fg);
    font-variant-numeric: tabular-nums; min-width: 3.5em; text-align: right; }
  #opsettings-modal .intro-foot { display: flex; align-items: center; justify-content: space-between;
    gap: 14px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line);
    flex-wrap: wrap; }
  #opsettings-modal .intro-btns { display: flex; gap: 10px; margin-left: auto; }
  #opsettings-modal .intro-btns button, #opsettings-modal .intro-foot > .intro-secondary {
    border-radius: 8px; padding: 9px 18px; font-size: 14px; cursor: pointer;
    border: 1px solid var(--line); }
  #opsettings-modal .intro-secondary { background: var(--control); color: var(--fg); }
  #opsettings-modal .intro-secondary:hover { border-color: var(--accent); }
  #opsettings-modal .intro-primary { background: var(--accent); border-color: var(--accent);
    color: #fff; font-weight: 700; }
  #opsettings-modal .intro-primary:hover { filter: brightness(1.06); }
  #opsettings-modal :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
  <div id="map"></div>
  <div id="topbar"></div>
  <!-- 断面ツール。「測線を引く」とグラフを 1 枚のパネルにまとめる。
       #toolbar-row は controls.ts が組む。#section は線を引くまで hidden -->
  <div id="toolbar" class="panel">
    <div id="toolbar-row"></div>
    <div id="section">
      <div class="sec-head">
        <button id="sec-fit" type="button" data-tip="断面図の縦の表示範囲を、起伏に合わせた拡大と全体表示で切り替える">全体を見る</button>
        <button id="sec-close" type="button" data-tip="断面図を閉じて測線を消す">×</button>
      </div>
      <canvas id="sec-canvas"></canvas>
    </div>
  </div>
  <div id="controls"></div>
  <div id="perf" class="panel"></div>
  <div id="point-buffer" class="panel"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
